# Environment for running these notebooks on Binder (mybinder.org reads this file automatically).
# It also works locally:  conda env create -f environment.yml
#
# The minimum versions are the ones these notebooks were tested with (2026-09-30), so that Binder
# does not fall back to the older versions in its base image. ipykernel 7.4.0 was very new then.
name: epad_2body
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy>=2.1,<3
  - matplotlib-base>=3.11.2,<4
  - matplotlib-inline>=0.2.2      # 0.1.6 or older shows no inline figures with IPython >= 8.24
  - ipython>=9.17.1
  - ipykernel>=7.4.0
  - ipywidgets>=8.1.9,<9
  - nbclient>=0.11.0              # runs the notebook for the app view (Voila)
  - jupyterlab>=4.6.4,<5          # the "code" view
  - voila>=0.5.13,<0.6            # the "app" view (code hidden); see postBuild for a workaround
  - nbclassic>=1.3.3              # supplies the MathJax 2 that Voila needs: without it, equations in the
                                  # app view stay as raw LaTeX (Voila's default MathJax 3 URL fails to load)
